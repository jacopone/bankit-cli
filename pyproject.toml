[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "bankit-cli"
version = "0.1.0"
description = "Agent-friendly CLI and Python library for Banca d'Italia statistics, with interchangeable data sources (BdI BDS, ECB). Unofficial."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jacopo Anselmi" }]
keywords = ["banca d'italia", "bds", "ecb", "sdmx", "statistics", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
test = ["pytest>=8"]

[project.scripts]
bankit = "bankit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bankit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: needs the network and the live sources; run with -m live"]
pythonpath = ["src"]
